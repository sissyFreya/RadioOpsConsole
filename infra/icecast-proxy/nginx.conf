server {
  listen 8000;
  server_name _;
  root /usr/share/nginx/html;

  # Root redirect → default listener
  location = / {
    return 302 /listen;
  }

  # Listener page: /listen (generic) or /<mount>/listen
  location = /listen {
    try_files /listen.html =404;
  }

  location ~ ^/([^/]+)/listen$ {
    try_files /listen.html =404;
  }

  # Icecast JSON stats (used by listen.html and backend)
  location = /status-json.xsl {
    proxy_pass http://icecast:8000/status-json.xsl;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Agent API proxy (track library, skip, queue) — used by listen.html
  location /api/ {
    proxy_pass http://agent:9000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    add_header Cache-Control "no-cache";
    add_header Access-Control-Allow-Origin "*";
  }

  # Dynamic Icecast stream mounts — handles /test, /demo-radio, /radio_1, etc.
  # Browsers → redirect to /<mount>/listen
  # Audio clients → proxy with streaming-appropriate parameters
  location ~ "^/[a-z0-9][a-z0-9_-]*$" {
    if ($http_accept ~* "text/html") {
      return 302 $uri/listen;
    }
    proxy_pass http://icecast:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # Proxy everything else to Icecast (admin panel, static assets, etc.)
  location / {
    proxy_pass http://icecast:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
